# Esegue tutti i test a ogni push e a ogni pull request.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 è la versione usata su PythonAnywhere
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze
        # Pillow per l'app è facoltativo (su PythonAnywhere c'è già), ma test_spesa lo usa
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest Pillow

      - name: Esegui i test
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
